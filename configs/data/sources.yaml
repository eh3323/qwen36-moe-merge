# Data pipeline configuration (single source of truth for revisions, filters, budgets).
# Paths are resolved relative to $APEX (default /scratch/eh3323/apex).
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  benchmarks: data/benchmarks
  model_dir: models/Qwen3.6-35B-A3B          # tokenizer + chat_template.jinja
  mini_toolcall_yaml: data/benchmarks/swebench_pro_repo/v2/tooling/configs/mini_toolcall.yaml
  terminus_template: data/benchmarks/harbor_repo/src/harbor/agents/terminus_2/templates/terminus-json-plain.txt
  tb1_safe_list: work/research/tb1_safe_tasks.txt
  tb_overlap_json: work/research/tb_overlap.json

seed: 20261013
val_fraction: 0.02            # by instance id (group split)
token_budget_per_expert: 15000000   # train tokens (n_tokens incl. prompt), token-matched across experts
# Selection stops at the token budget OR at experts.<e>.target_count (hard cap), whichever comes first.
# Optional per-expert override: experts.<e>.token_budget (e.g. 30000000 for ~800 SWE trajectories).

