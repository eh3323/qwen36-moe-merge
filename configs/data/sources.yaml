# ---------------- per-expert recipes ----------------
experts:
  swe:
    max_tokens: 65536
    target_count: 800
    hard_fraction: 0.5           # hard = >=2 non-test files changed OR >=40 assistant turns
    max_per_instance: 2
    max_repo_fraction: 0.03
    secondary_fraction: 0.25     # SWE-Hero share of the final set (R2E-Gym-sourced rows only)
    swe_pro_repos: [NodeBB/NodeBB, ansible/ansible, element-hq/element-web, flipt-io/flipt,
                    future-architect/vuls, gravitational/teleport, internetarchive/openlibrary,
                    navidrome/navidrome, protonmail/WebClients, qutebrowser/qutebrowser, tutao/tutanota]
    drop_orgs: [ansible]
    # cheap fork heuristic: repo basename equals a SWE-Pro repo basename, or the patch touches a
    # path that is distinctive for a SWE-Pro code base
    fork_basenames: [nodebb, ansible, element-web, flipt, vuls, teleport, openlibrary, navidrome,
                     webclients, qutebrowser, tutanota]
    fork_path_markers: ["lib/ansible/", "openlibrary/", "qutebrowser/", "src/posts/cache.js",
                        "navidrome/", "flipt/", "lib/teleport", "tutanota", "element-web",
                        "applications/mail/", "packages/components/containers/"]
    system_info: "Linux 5.15.0-1057-aws #63~20.04.1-Ubuntu SMP Mon Mar 25 10:29:36 UTC 2024 x86_64"
  tb:
    max_tokens: 32768
    target_count: 2000
    nemotron_fraction: 0.6
    nemotron_categories_exclude: [scientific_computing, data_science, model_training]
    nemotron_levels: [medium, mixed]
    ot_exclude_task_prefixes: [swesmith]
    candidate_pool_per_source: 9000
    max_incomplete_fraction: 0.15   # trajectories without final task_complete kept for recovery behaviour
  asi:
    max_tokens: 32768
    target_count: 1000
    jupyter_fraction: 0.15
    nemotron_subsets: ["medium/scientific_computing", "mixed/scientific_computing",
                       "medium/data_science", "mixed/data_science", "medium/model_training"]
    candidate_pool: 8000
    embed_threshold: 0.85
    # named-method blacklist (research_datasets.md §2 E-ASI); matched case-insensitively on word boundaries
    method_blacklist: ["lid-driven cavity", "ghia", "kosterlitz", "xy model", "neal's funnel", "gillespie",
                       "de young-keizer", "young-keizer", "sapt", "metadynamics", "ball-berry", "farquhar",
                       "topmodel", "richards equation", "rnea", "pose graph", "contact process", "glauber",
                       "vpfm", "marcus theory", "marcus rate", "vtst", "lkh", "max-3-sat", "homotopy continuation",
                       "conformal mapping", "conformal map", "ukf", "bearing-only", "particle filter",
                       "occupancy grid", "iterative closest point", "lattice boltzmann", "michaelis-menten cme",
                       "ip3r", "go-model", "gō-model", "directed percolation", "symplectic integrator",
                       "lidar-imu", "nnls deblur", "icp"]
    opencode:
      model_api_id: Qwen/Qwen3.6-35B-A3B
      provider_id: bench
      workdir: /app
      date: "Tue Oct 13 2026"
  hle:
    max_tokens: 32768
    target_count: 2000
    mix: {nemotron_math_aops: 0.40, nemotron_science_mcq: 0.30, nemotron_science_rqa: 0.15, osr2_nonstem: 0.15}
    candidate_pool_per_source: 12000
    embed_threshold: 0.90
    heldout_count: 300          # held-out items from the same sources -> HLE dev set
